services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sped_evidence_loop
      POSTGRES_PASSWORD: sped_local
      POSTGRES_USER: sped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sped -d sped_evidence_loop"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
